name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  id-token: write   # needed for OIDC auth to AWS
  contents: read
  security-events: write  # needed to upload Trivy SARIF results

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: devops-demo-api-dev

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "app/requirements-dev.txt"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: app
        run: uv pip install --system -r requirements-dev.txt

      - name: Lint (ruff)
        working-directory: app
        run: uv run ruff check .

      - name: Run unit tests
        working-directory: app
        run: uv run pytest -v

  sast:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: p/python

  build-scan-push:
    runs-on: ubuntu-latest
    needs: [lint-and-test, sast]
    if: github.ref == 'refs/heads/main'
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        working-directory: app
        run: |
          docker build -t "$ECR_REPOSITORY:${{ steps.meta.outputs.tag }}" .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.tag }}"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "1" # fail the build on critical/high vulns

      - name: Upload Trivy results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-results.sarif"

      - name: Tag and push image to ECR
        run: |
          IMAGE_URI="${{ steps.ecr-login.outputs.registry }}/$ECR_REPOSITORY:${{ steps.meta.outputs.tag }}"
          docker tag "$ECR_REPOSITORY:${{ steps.meta.outputs.tag }}" "$IMAGE_URI"
          docker push "$IMAGE_URI"
          echo "Pushed $IMAGE_URI"